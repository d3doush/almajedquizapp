<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الموظف</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard-container">
        <h2 id="welcomeMessage">أهلاً بك، [اسم الموظف]!</h2>

        <div class="results-box">
            <h3>نتائجك و ترتيبك</h3>
            <div id="rankingResults">
                <p>جارِ تحميل نتائجك...</p>
            </div>
            
            <div class="ranking-options">
                <label for="rankingView">اختر طريقة عرض الترتيب:</label>
                <select id="rankingView">
                    <option value="exhibition">ترتيبي ضمن المعرض</option>
                    <option value="city">ترتيبي ضمن المدينة</option>
                    <option value="region">ترتيبي ضمن المنطقة</option>
                    <option value="all">ترتيبي بين جميع الموظفين</option>
                </select>
                <button id="viewRankingBtn">عرض الترتيب</button>
            </div>
        </div>

        <div class="quiz-box">
            <h3>صفحة الأسئلة</h3>
            <p>انقر على الزر أدناه لبدء اختبار اليوم.</p>
            <button id="startQuizBtn">ابدأ الاختبار</button>
        </div>
    </div>
    
    <script src="dashboard-script.js"></script>
</body>
</html>
